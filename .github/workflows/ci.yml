name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
          pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t service-ci .
      - name: Verify non-root runtime and readiness
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs service-ci-api || true; docker rm -f service-ci-api || true' EXIT
          docker run -d --name service-ci-api -p 127.0.0.1:18080:8080 service-ci
          test "$(docker exec service-ci-api id -u)" = "10001"
          curl --fail --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 --retry-max-time 45 --max-time 3 http://127.0.0.1:18080/v1/readyz
          curl --fail --max-time 3 http://127.0.0.1:18080/healthz
